# Pubblica la cartella landing/ su GitHub Pages: la landing alla radice del sito e la build
# Web di Unity in landing/gioca/ (indirizzo .../gioca/).
# Richiede in Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Landing su GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - ".github/workflows/landing.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pubblicazione.outputs.page_url }}
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: landing

      - name: Controlla la build Web
        run: |
          if [ -d landing/gioca ]; then
            test -f landing/gioca/index.html || { echo "::error::Manca landing/gioca/index.html: copia l'intera cartella della build Web"; exit 1; }
            ls landing/gioca/Build/*.loader.js > /dev/null 2>&1 || { echo "::error::Manca il loader in landing/gioca/Build: la build Web è incompleta"; exit 1; }
            echo "Build Web trovata in landing/gioca ($(du -sh landing/gioca | cut -f1))"
          else
            echo "Nessuna build Web in landing/gioca: si pubblica solo la landing"
          fi

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepara la landing
        uses: actions/upload-pages-artifact@v4
        with:
          path: landing

      - name: Pubblica
        id: pubblicazione
        uses: actions/deploy-pages@v4
